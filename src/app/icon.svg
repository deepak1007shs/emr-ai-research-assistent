<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SAP Builder">
  <!--
    Fourteen tapered spokes from a solid centre, cut heavy enough to survive a
    browser tab: at sixteen pixels a finer burst turns into a dot. Lengths cycle
    through eight values rather than alternating between two, so it reads as
    drawn rather than stamped out by a compass, and the longest stops short of
    the frame, because a mark that touches its own edge looks cropped.
  -->
