<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EMR AI Research Assistant">
  <!--
    Drawn flat. The mark it comes from is moulded, with a bevel on the ground
    and a soft shadow under the figure, and none of that survives a browser tab:
    at sixteen pixels a highlight is one lighter pixel and a shadow is a smudge.
    What survives is the shape, so the shape carries it.

    The inner rule is stroked rather than filled, which keeps a constant weight
    at every size, and it stops short of the corner radius so the frame reads as
    a frame and not as a second square. The figure is one rail between two posts
    with a block at the centre: a table's structure, which is what the app
    builds, and the widest thing that still resolves at favicon size.
  -->
  <rect width="64" height="64" rx="14" fill="#3059c9" />
  <rect x="8.2" y="8.2" width="47.6" height="47.6" rx="10.5" fill="none" stroke="#ffffff" stroke-width="3.8" />
  <g fill="#ffffff">
    <rect x="17.3" y="25.7" width="3.4" height="12.6" rx="1.5" />
    <rect x="43.3" y="25.7" width="3.4" height="12.6" rx="1.5" />
    <rect x="19.1" y="30.3" width="25.8" height="3.4" rx="1.5" />
    <rect x="27.4" y="27.4" width="9.2" height="9.2" rx="1.9" />
  </g>
</svg>
